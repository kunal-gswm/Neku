name: Bug Report
description: Report a reproducible defect or unexpected behavior in Neku
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check [existing issues](https://github.com/kunal-gswm/Neku/issues) before opening a new one.
        If this is a security vulnerability, please see our [Security Policy](https://github.com/kunal-gswm/Neku/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: version
    attributes:
      label: Neku Version
      description: What version of Neku are you using?
      options:
        - "v1.0.4 (Latest Release)"
        - "v1.0.3"
        - "v1.0.2"
        - "v1.0.1"
        - "v1.0.0"
        - "Built from main branch"
        - "Other (specify below)"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      description: How did you install or run Neku?
      options:
        - "Windows Setup Installer (Neku-Setup-*.exe)"
        - "Portable Executable (Neku.exe)"
        - "Self-built from source via dotnet"
    validations:
      required: true

  - type: dropdown
    id: os_version
    attributes:
      label: Windows Version
      description: What operating system are you running?
      options:
        - "Windows 11 (24H2 or newer)"
        - "Windows 11 (23H2 or 22H2)"
        - "Windows 10 (22H2 or 21H2)"
        - "Windows 10 (1809–20H2)"
        - "Other / Insider Preview (specify below)"
    validations:
      required: true

  - type: input
    id: companion_pack
    attributes:
      label: Active Companion
      description: Which companion was active when the issue occurred? (e.g., Neku, Billu, Classic Cat, Janet, Custom Pack)
      placeholder: "e.g., Neku (Mascot) / Billu / Custom pack"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "Describe what went wrong..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Launch Neku
        2. Press 'Ctrl + Alt + P' to open Command Palette
        3. Click on '...'
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred instead.
    validations:
      required: true

  - type: textarea
    id: logs_or_doctor
    attributes:
      label: Doctor Output / Logs / Screenshots
      description: |
        If possible, run `neku doctor --json` in PowerShell and paste the output here, or paste relevant error logs / drag-and-drop screenshots.
      render: shell

  - type: checkboxes
    id: verification_checklist
    attributes:
      label: Verification Checklist
      options:
        - label: "I searched existing issues and verified this is not a duplicate."
          required: true
        - label: "I verified that this issue does not contain private personal data or confidential companion assets."
          required: true
