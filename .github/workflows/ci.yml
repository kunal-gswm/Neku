name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DesktopPet.sln -c Release --nologo

      - name: Test
        run: dotnet test tests/DesktopPet.Tests/DesktopPet.Tests.csproj -c Release --nologo

      # Publishing is where asset embedding and single-file packaging can quietly break, and a
      # broken artifact is only noticed at release time otherwise.
      - name: Verify release artifacts publish cleanly
        shell: pwsh
        run: |
          .\scripts\publish.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Build and verify Windows Installer
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 -SkipPublish
