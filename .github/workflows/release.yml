name: Release

# Cut a release by pushing a version tag:
#   git tag v1.1.0 && git push origin v1.1.0
#
# This builds the self-contained single-file exe and attaches it to a GitHub Release.
# Neku's in-app updater reads exactly that release asset, so this workflow is what makes
# "check for updates" work for users who never cloned the repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $csproj = [xml](Get-Content src/DesktopPet/DesktopPet.csproj)
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) -join ''
          Write-Host "tag=$tag  csproj=$version"
          if ($tag -ne $version) {
            # The updater compares the running assembly version to the release tag. If they
            # disagree, users either never see the update or are offered it forever.
            throw "Tag v$tag does not match <Version>$version</Version> in DesktopPet.csproj."
          }

      - name: Test
        run: dotnet test tests/DesktopPet.Tests/DesktopPet.Tests.csproj --nologo

      - name: Publish
        run: dotnet publish src/DesktopPet/DesktopPet.csproj -c Release -o dist --nologo

      - name: Tidy the artifact
        shell: pwsh
        run: |
          Remove-Item dist/*.pdb -Force -ErrorAction SilentlyContinue
          $stray = Get-ChildItem dist | Where-Object { $_.Name -ne 'Neku.exe' }
          if ($stray) { throw "Publish produced more than the exe: $($stray.Name -join ', ')" }
          Get-FileHash dist/Neku.exe -Algorithm SHA256 |
            ForEach-Object { "SHA256: $($_.Hash)" } | Tee-Object -FilePath dist/SHA256.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Build Windows Installer
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 -SkipPublish
          $installer = Get-ChildItem artifacts/Neku-Setup-*.exe | Select-Object -First 1
          Get-FileHash $installer.FullName -Algorithm SHA256 |
            ForEach-Object { "SHA256 ($($installer.Name)): $($_.Hash)" } | Tee-Object -FilePath artifacts/SHA256-installer.txt
          Get-Content artifacts/SHA256-installer.txt | Add-Content dist/SHA256.txt

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/Neku-Setup-*.exe
            dist/Neku.exe
            dist/SHA256.txt
          generate_release_notes: true
          body: |
            ## Install Options

            ### 1. Windows Setup Installer (Recommended)
            Download **Neku-Setup-*.exe** below and run it.
            - Installs per-user without requiring administrator privileges (`%LocalAppData%\Programs\Neku`).
            - Configures the Start Menu shortcut with the native **Ctrl + Alt + N** summon hotkey.
            - Optional Desktop shortcut and automatic startup with Windows.
            - Clean uninstaller included; never touches user notes, settings, or custom companions.

            ### 2. Standalone Portable Executable
            Download **Neku.exe** below and run it. That's the whole install — no .NET, no
            git, no extra folders. Windows may warn about an unrecognized app the first time;
            choose **More info → Run anyway**.

            ### Keyboard Shortcuts
            - **Ctrl + Alt + N**: Launch or unhide Neku
            - **Ctrl + Alt + Q**: Gracefully exit Neku

            Already running Neku? It will offer to update itself.
